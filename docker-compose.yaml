services:
  url-to-mealie:
    build: ./url-to-mealie
    image: url-to-mealie
    ports:
      - "${URL_TO_MEALIE_PORT}:${URL_TO_MEALIE_PORT}"
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "${URL_TO_MEALIE_ARG_HOST}",
        "--port",
        "${URL_TO_MEALIE_PORT}",
      ]
    volumes:
      - /tmp:/tmp
      - recipe_logs:/var/log
    environment:
      - MEALIE_TOKEN=${MEALIE_API_KEY}
      - MEALIE_BASE_URL=${MEALIE_BASE_URL}
      - MEALIE_STATIC_URL=${MEALIE_STATIC_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LLM_RESPONSE_TIMEOUT=${LLM_RESPONSE_TIMEOUT:-600}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
      - IG_COOKIES_NETSCAPE=${IG_COOKIES_NETSCAPE:-}
      - IG_SESSIONID=${IG_SESSIONID:-}
      - IG_CSRFTOKEN=${IG_CSRFTOKEN:-}
      - IG_COOKIE_STRING=${IG_COOKIE_STRING:-}
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - url-to-mealie

networks:
  url-to-mealie:
    name: ${DOCKER_NETWORK_NAME:-url-to-mealie}
    external: true

volumes:
  recipe_logs:
