services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    runtime: nvidia
    ports:
      - "${LLAMA_ARG_PORT}:${LLAMA_ARG_PORT}"
    volumes:
      - ./models:/app/models:ro
      - llm_logs:/var/log
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - llm-network

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    runtime: nvidia
    ports:
      - "${WHISPER_PORT}:${WHISPER_PORT}"
    entrypoint: /app/build/bin/whisper-server
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              capabilities: [gpu]
    command:
      [
        "-m",
        "${WHISPER_MODEL_PATH}",
        "--port",
        "${WHISPER_PORT}",
        "--host",
        "${WHISPER_ARG_HOST}",
      ]
    volumes:
      - ./models:/app/models:ro
      - whisper_logs:/var/log
    restart: unless-stopped
    networks:
      - whisper-network

  url-to-mealie:
    build: ./url-to-mealie
    image: url-to-mealie
    ports:
      - "${URL_TO_MEALIE_PORT}:${URL_TO_MEALIE_PORT}"
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "${URL_TO_MEALIE_ARG_HOST}",
        "--port",
        "${URL_TO_MEALIE_PORT}",
      ]
    volumes:
      - /tmp:/tmp
      - recipe_logs:/var/log
    env_file: .env
    environment:
      - MEALIE_TOKEN=${MEALIE_API_KEY}
      - MEALIE_BASE_URL=${MEALIE_BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LLAMA_ARG_HOST=llm
      - LLAMA_ARG_PORT=${LLAMA_ARG_PORT}
      - WHISPER_ARG_HOST=whisper
      - WHISPER_PORT=${WHISPER_PORT}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - llm-network
      - whisper-network

networks:
  llm-network:
    driver: bridge
  whisper-network:
    driver: bridge

volumes:
  recipe_logs:
  llm_logs:
  whisper_logs:
