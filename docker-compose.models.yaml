services:
  llm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13}
    runtime: nvidia
    ports:
      - "${LLAMA_ARG_PORT}:${LLAMA_ARG_PORT}"
    volumes:
      - ./models:/app/models:ro
      - llm_logs:/var/log
    env_file: .env
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 80
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - url-to-mealie

  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main-cuda}
    runtime: nvidia
    ports:
      - "${WHISPER_PORT:-6997}:80"
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1.5G
          devices:
            - driver: nvidia
              capabilities: [gpu]
    entrypoint: /app/build/bin/whisper-server
    command:
      ["-m", "${WHISPER_MODEL_PATH}", "--port", "80", "--host", "0.0.0.0"]
    volumes:
      - ./models:/app/models:ro
      - whisper_logs:/var/log
    restart: unless-stopped
    networks:
      - url-to-mealie

networks:
  url-to-mealie:
    name: ${DOCKER_NETWORK_NAME:-url-to-mealie}
    external: true

volumes:
  llm_logs:
  whisper_logs:
